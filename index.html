/* HammerHunt launch polish — visual layer only */
:root{--hh-navy:#111827;--hh-gold:#f2b91f;--hh-gold2:#ffd45c;--hh-ink:#101828;--hh-line:#e7e4dc;--hh-muted:#667085}
body{background:radial-gradient(circle at top right,rgba(242,185,31,.07),transparent 34rem),linear-gradient(180deg,#fbfaf6 0,#f5f6f8 42rem,#f7f7f4 100%);color:var(--hh-ink)}
header{background:rgba(17,24,39,.97);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 8px 30px rgba(17,24,39,.16)}
.top{max-width:1240px;padding:15px 22px}.brand{font-size:28px;letter-spacing:.9px}.brand span{color:var(--hh-gold)}

main{max-width:1240px;margin:28px auto 60px;padding:0 22px}

.hero h1{max-width:760px;font-size:clamp(42px,6vw,72px);line-height:.95;letter-spacing:-2.6px;margin:0 0 14px}.hero p{max-width:780px;font-size:16px;line-height:1.65;color:#d5dbea}

.marketHeader{margin:26px 0 14px;align-items:flex-end}.marketEyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;color:#9a7b1f;margin-bottom:3px}.marketTitle{margin:0;font-size:28px}

.card:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(16,24,40,.13);border-color:#ded8ca}
.photo{height:238px;background:#ece9e2}.pad{padding:18px 18px 19px}.title{font-size:20px;line-height:1.28;margin-top:5px}

.emptyMarket{grid-column:1/-1;min-height:250px;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at top center,rgba(242,185,31,.09),transparent 18rem),#fff;border:1px dashed #d9d4c8;border-radius:22px;padding:34px}

/* Marketplace discovery controls */
.hero{padding:32px 40px}
.hero h1{font-size:clamp(38px,5.4vw,62px);max-width:820px}
.marketTools{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin:0 0 14px;
}
.marketSearch{
  position:relative;
  flex:1;
  min-width:260px;
}
.marketSearch input{
  height:48px;
  padding:0 16px 0 44px;
  border-radius:14px;
  background:#fff;
  border:1px solid #dedbd3;
  box-shadow:0 7px 18px rgba(16,24,40,.05);
}
.marketSearchIcon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
  pointer-events:none;
  font-size:18px;
}
.categoryScroller{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 12px;
  scrollbar-width:thin;
}
.categoryChip{
  flex:0 0 auto;
  border:1px solid #dedbd3;
  background:#fff;
  color:#344054;
  border-radius:999px;
  padding:9px 13px;
  font-size:13px;
  font-weight:850;
  box-shadow:0 4px 12px rgba(16,24,40,.04);
}
.categoryChip:hover{border-color:#d3b04a;background:#fffaf0}
.categoryChip.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
  box-shadow:0 7px 16px rgba(17,24,39,.15);
}
.resultMeta{
  color:#667085;
  font-size:13px;
  white-space:nowrap;
}
.noMatches{
  grid-column:1/-1;
  background:#fff;
  border:1px dashed #d9d4c8;
  border-radius:18px;
  padding:28px;
  text-align:center;
  color:#667085;
}
@media(max-width:700px){
  .hero{padding:26px 22px}
  .hero h1{font-size:40px}
  .marketTools{display:block}
  .resultMeta{margin-top:8px}
  .marketSearch{min-width:0}
  .categoryScroller{margin-top:10px}
}


/* Populated marketplace refinement */
.card{
  display:flex;
  flex-direction:column;
  min-height:100%;
}
.photo{
  height:auto;
  aspect-ratio:4/3;
  position:relative;
  overflow:hidden;
  background:#ece9e2;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.pad{

  flex-direction:column;

}
.priceRow{margin-top:auto}
.card .goldBtn{min-height:42px}

  padding:4px 7px;
  border-radius:8px;
  background:#fff4ef;
  color:#b42318;

}
.countdown.urgent{
  background:#fee4e2;

}
.countdown.finalMinute{
  background:#b42318;
  color:#fff;
  box-shadow:0 0 0 1px #912018 inset,0 4px 12px rgba(180,35,24,.18);
}

function onPhotoPick(event){
  const files=Array.from(event?.target?.files||[]).filter(f=>f.type?.startsWith('image/')).slice(0,10);
  pendingPhotos=files;
  const preview=document.getElementById('photoPreview');
  if(!preview)return;
  preview.innerHTML='';
  files.forEach((file,i)=>{
    const box=document.createElement('div');
    box.className='preview';
    const img=document.createElement('img');
    img.alt=`Auction photo ${i+1}`;
    const url=URL.createObjectURL(file);
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);
    preview.appendChild(box);
  });
}

    const start=Number(document.getElementById('rStart').value||0);
    const now=Date.now();
    const row={
      title:document.getElementById('rTitle').value.trim(),
      category_id:a.category_id,
      condition:document.getElementById('rCondition').value.trim(),
      description:document.getElementById('rDesc').value.trim(),
      starting_bid:start,
      current_bid:start,
      starts_at:new Date(now).toISOString(),
      ends_at:new Date(now+duration*60000).toISOString(),
      status:'live',
      shipping_available:document.getElementById('rShipOn').checked,
      shipping_price:document.getElementById('rShipOn').checked?Number(document.getElementById('rShip').value||0):null,
      pickup_available:document.getElementById('rPickup').checked,
      pickup_instructions:document.getElementById('rPickup').checked?document.getElementById('rPickupInfo').value.trim():null
    };

    if(error)return alert(error.message);

    const oldPhotos=photosFor(id);
    if(oldPhotos.length){
      const photoRows=oldPhotos.map((p,i)=>({
        auction_id:newAuction.id,
        storage_path:p.storage_path,
        sort_order:i
      }));
      await sb.from('auction_photos').insert(photoRows);
    }

    closeModal();
    await loadData();
    renderAdmin();
    alert('Auction relisted.');
  };
}

async function deleteAuction(id){
  const a=auctions.find(x=>x.id===id); if(!a)return;
  if(!confirm(`Delete "${a.title}"? This cannot be undone.`))return;
  const {error}=await sb.from('auctions').delete().eq('id',id);
  if(error)return alert(error.message);
  await loadData(); renderAdmin();
}

async function updateFulfillment(orderId,hasTracking){
  const select=document.getElementById('fs-'+orderId);
  const msg=document.getElementById('save-msg-'+orderId);
  const status=select?.value||'pending';
  const tracking=hasTracking?(document.getElementById('trk-'+orderId)?.value||''):null;
  if(select)select.disabled=true;
  if(msg){msg.textContent='Saving...';msg.style.fontWeight='800'}
  try{
    const r=await fetch(SUPA+'/functions/v1/admin-update-fulfillment',{
      method:'POST',
      headers:{
        Authorization:'Bearer '+session.access_token,
        apikey:KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({order_id:orderId,status,tracking_number:tracking})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Unable to save fulfillment');
    if(msg){msg.textContent='Saved: '+status.replaceAll('_',' ');msg.style.fontWeight='900'}
    if(select)select.disabled=false;
  }catch(err){
    if(msg){msg.textContent='Save failed: '+(err?.message||String(err));msg.style.fontWeight='900'}
    if(select)select.disabled=false;
  }
}

async function createAuction(){const title=aTitle.value.trim(),start=Number(aStart.value),duration=Number(aDuration.value);if(!title||Number.isNaN(start)||!Number.isFinite(duration)||duration<1)return alert('Enter title, starting bid, and duration in minutes.');const now=Date.now();const row={title,category_id:aCat.value,condition:aCondition.value.trim(),description:aDesc.value.trim(),starting_bid:start,current_bid:start,starts_at:new Date(now).toISOString(),ends_at:new Date(now+duration*60000).toISOString(),status:'live',shipping_available:aShipOn.checked,shipping_price:aShipOn.checked?Number(aShip.value||0):null,pickup_available:aPickup.checked,pickup_instructions:aPickup.checked?aPickupInfo.value.trim():null};const{data:a,error}=await sb.from('auctions').insert(row).select('id').single();if(error)return alert(error.message);for(let i=0;i<pendingPhotos.length;i++){const f=pendingPhotos[i],raw=(f.name.split('.').pop()||'jpg').toLowerCase(),ext=raw.replace(/[^a-z0-9]/g,'')||'jpg',path=`${a.id}/${String(i).padStart(2,'0')}-${crypto.randomUUID()}.${ext}`;const{error:upErr}=await sb.storage.from('auction-images').upload(path,f,{contentType:f.type||undefined,upsert:false});if(upErr){alert(`Auction published, but photo ${i+1} failed: ${upErr.message}`);continue}const{error:dbErr}=await sb.from('auction_photos').insert({auction_id:a.id,storage_path:path,sort_order:i});if(dbErr)alert(`Photo ${i+1} uploaded but could not be attached: ${dbErr.message}`)}pendingPhotos=[];await loadData();alert('Auction published.');renderAdmin()}
