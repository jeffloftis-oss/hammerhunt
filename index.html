<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>HammerHunt</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17191d;--muted:#697180;--line:#e4e7ec;--dark:#111827;--gold:#fbbf24;--green:#087443;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:5}.top{max-width:1100px;margin:auto;padding:15px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{font-size:26px;font-weight:900}.brand span{color:var(--gold)}nav{display:flex;gap:6px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--dark);color:#fff}.ghost{background:#ffffff18}.light{background:#eef1f4;color:#111827}.good{background:var(--green)}main{max-width:1100px;margin:22px auto;padding:0 16px}.hero{background:linear-gradient(135deg,#111827,#26344e);color:#fff;padding:28px;border-radius:18px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:36px}.hero p{margin:0;color:#d3dae6}.notice{background:#fff7d6;border:1px solid #f4d866;padding:12px;border-radius:10px;margin:12px 0}.ok{background:#eaf7ef;border:1px solid #b7e0c7;color:#08653c;padding:12px;border-radius:10px;margin:12px 0}.err{background:#fff0ee;border:1px solid #f4b9b2;color:#9d1c12;padding:12px;border-radius:10px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #0000000a}.card{overflow:hidden;cursor:pointer}.card:active{transform:scale(.995)}.pad,.panel{padding:17px}.photo{height:160px;background:#e9edf2;display:flex;align-items:center;justify-content:center;font-weight:900;color:#8b94a2}.title{font-size:18px;font-weight:900}.muted{font-size:13px;color:var(--muted)}.price{font-size:24px;font-weight:900;margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.hidden{display:none!important}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:900;background:#eef1f4}.status.approved{background:#eaf7ef;color:#08653c}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}textarea{min-height:100px}label{font-size:13px;font-weight:800;display:block;margin:10px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:29px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="top"><div class="brand">HAMMER<span>HUNT</span></div><nav><button class="ghost" onclick="showView('auctions')">Auctions</button><button class="ghost" onclick="showView('account')">My Account</button><button id="adminNav" class="ghost hidden" onclick="showView('admin')">Admin</button><button id="authBtn" class="ghost" onclick="openAuthChoice()">Sign In</button></nav></div></header><main id="app"><div class="panel">Loading HammerHunt…</div></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SUPA='https://cboodkfcfvshsxirpkxt.supabase.co';const KEY='sb_publishable_VDsMnqHeYHajdKendarwww_hMX9fMM2';const sb=createClient(SUPA,KEY);let session=null,profile=null,categories=[],auctions=[],currentView='auctions',activeAuctionId=null,realtimeChannel=null;const money=n=>'$'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const remain=d=>{let x=new Date(d)-Date.now();if(x<=0)return'Ended';let h=Math.floor(x/36e5),m=Math.floor((x%36e5)/6e4),sec=Math.floor((x%6e4)/1e3);return h>=24?Math.floor(h/24)+'d '+(h%24)+'h':h>0?h+'h '+m+'m '+sec+'s':m+'m '+sec+'s'};window.showView=showView;window.openAuthChoice=openAuthChoice;window.openSignIn=openSignIn;window.openSignUp=openSignUp;window.closeModal=()=>{activeAuctionId=null;document.getElementById('modal').classList.remove('show')};window.signOutNow=async()=>{await sb.auth.signOut();session=null;profile=null;await boot()};window.cardSetup=cardSetup;window.createAuction=createAuction;window.openAuction=openAuction;window.placeNextBid=placeNextBid;
function tickCountdowns(){document.querySelectorAll('[data-ends-at]').forEach(el=>{el.textContent=remain(el.dataset.endsAt)});if(activeAuctionId){const a=auctions.find(x=>x.id===activeAuctionId);if(a){const el=document.getElementById('modalCountdown');if(el)el.textContent=remain(a.ends_at);if(new Date(a.ends_at)<=new Date()){const btn=document.getElementById('bidBtn');if(btn){btn.disabled=true;btn.textContent='Auction Ended'}}}}}
setInterval(tickCountdowns,1000);
async function refreshLiveAuction(payload){if(payload?.new?.id){const i=auctions.findIndex(a=>a.id===payload.new.id);if(i>=0)auctions[i]={...auctions[i],...payload.new};else await loadData()}else await loadData();if(currentView==='auctions')renderAuctions();if(activeAuctionId)openAuction(activeAuctionId)}
function startRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('hammerhunt-auctions').on('postgres_changes',{event:'*',schema:'public',table:'auctions'},refreshLiveAuction).subscribe()}
async function boot(){const{data:{session:s}}=await sb.auth.getSession();session=s;if(session){const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();profile=p}else profile=null;const b=document.getElementById('authBtn');b.textContent=session?'Sign Out':'Sign In';b.onclick=session?window.signOutNow:openAuthChoice;document.getElementById('adminNav').classList.toggle('hidden',!profile?.is_admin);await loadData();startRealtime();showView(location.search.includes('payment=')?'account':'auctions')}
async function loadData(){const[{data:c},{data:a}]=await Promise.all([sb.from('categories').select('*').eq('is_active',true).order('sort_order'),sb.from('auctions').select('*,categories(name)').in('status',['scheduled','live','ended']).order('ends_at')]);categories=c||[];auctions=a||[]}
function showView(v){currentView=v;activeAuctionId=null;if(v==='auctions')renderAuctions();if(v==='account')renderAccount();if(v==='admin')renderAdmin()}
function renderAuctions(){let html='<section class="hero"><h1>Bid. Win. Done.</h1><p>Verified bidders, $5 increments, and a 1-minute anti-sniping rule.</p></section>';if(!session)html+='<div class="notice"><b>Want to bid?</b> Create an account and add a payment method first.</div>';html+='<div class="grid">'+(auctions.length?auctions.map(a=>`<article class="card" onclick="openAuction('${a.id}')"><div class="photo">HAMMERHUNT AUCTION</div><div class="pad"><div class="title">${esc(a.title)}</div><div class="muted">${esc(a.categories?.name||'General')}</div><div class="price">${money(a.current_bid)}</div><div class="muted">${a.status==='ended'?'Ended':'Ends in '}<span data-ends-at="${a.ends_at}">${a.status==='ended'?'':remain(a.ends_at)}</span></div><div class="muted" style="margin-top:6px">${a.shipping_available?`Shipping ${money(a.shipping_price)}`:'No shipping'}${a.pickup_available?' • Pickup available':''}</div><button style="margin-top:12px">View & Bid</button></div></article>`).join(''):'<div class="panel">No auctions are live yet.</div>')+'</div>';document.getElementById('app').innerHTML=html;tickCountdowns()}
function openAuction(id){activeAuctionId=id;const a=auctions.find(x=>x.id===id);if(!a)return;const ended=a.status==='ended'||new Date(a.ends_at)<=new Date();const next=Number(a.current_bid||0)+5;let action='';if(!session) action='<div class="notice">Sign in and add a payment method before bidding.</div><button onclick="openSignIn()">Sign In</button>';else if(!profile?.payment_verified)action='<div class="notice">A verified payment method is required before bidding.</div><button class="good" onclick="closeModal();showView(\'account\')">Add Payment Method</button>';else if(ended)action='<div class="notice">This auction has ended.</div>';else action=`<div class="ok">You are approved to bid.</div><button id="bidBtn" class="good" onclick="placeNextBid('${a.id}')">Place ${money(next)} Bid</button><p class="muted">Minimum increment is $5. A bid in the final 1 minutes extends the auction to 1 minutes remaining.</p>`;document.getElementById('modalbox').innerHTML=`<h2>${esc(a.title)}</h2><div class="price">${money(a.current_bid)}</div><p class="muted">${ended?'Ended':'Ends in '}<span id="modalCountdown" data-ends-at="${a.ends_at}">${ended?'':remain(a.ends_at)}</span></p>${a.condition?`<p><b>Condition:</b> ${esc(a.condition)}</p>`:''}${a.description?`<p>${esc(a.description)}</p>`:''}<p class="muted">${a.shipping_available?`Shipping ${money(a.shipping_price)}`:'No shipping'}${a.pickup_available?' • Pickup available':''}</p>${action}<div style="margin-top:14px"><button class="light" onclick="closeModal()">Close</button></div>`;document.getElementById('modal').classList.add('show')}
async function placeNextBid(id){const a=auctions.find(x=>x.id===id);if(!a)return;const amount=Number(a.current_bid||0)+5;const btn=document.getElementById('bidBtn');if(btn){btn.disabled=true;btn.textContent='Placing bid…'}const{data,error}=await sb.rpc('place_bid',{p_auction_id:id,p_amount:amount});if(error){alert(error.message);if(btn){btn.disabled=false;btn.textContent=`Place ${money(amount)} Bid`}return}await loadData();closeModal();renderAuctions();alert(`Bid placed at ${money(amount)}.`)}
async function renderAccount(){if(!session){document.getElementById('app').innerHTML='<div class="panel"><h2>My Account</h2><p>Create an account or sign in to bid.</p><div class="row" style="justify-content:flex-start"><button onclick="openSignUp()">Create Account</button><button class="light" onclick="openSignIn()">Sign In</button></div></div>';return}const[{data:bids},{data:wins}]=await Promise.all([sb.from('bids').select('*,auctions(title,current_bid,ends_at,status)').order('created_at',{ascending:false}),sb.from('orders').select('*,auctions(title)').order('created_at',{ascending:false})]);document.getElementById('app').innerHTML=`<div class="panel"><div class="row"><div><h2 style="margin:0">My Account</h2><p class="muted">${esc(session.user.email)}</p></div><span class="status ${profile?.payment_verified?'approved':''}">${profile?.payment_verified?'BID APPROVED':'PAYMENT REQUIRED'}</span></div>${!profile?.payment_verified?'<div class="notice">A valid payment method is required before any bid is accepted.</div><button class="good" onclick="cardSetup()">Add Payment Method</button>':'<div class="ok">Your account is approved to bid.</div>'}</div><div class="panel"><h2>My Bids</h2>${bids?.length?bids.map(b=>`<div><b>${esc(b.auctions?.title||'Auction')}</b> — ${money(b.amount)}</div>`).join(''):'<p class="muted">No bids yet.</p>'}</div><div class="panel"><h2>Past Wins</h2>${wins?.length?wins.map(w=>`<div><b>${esc(w.auctions?.title||'Auction')}</b> — ${money(w.winning_bid)}</div>`).join(''):'<p class="muted">No past wins yet.</p>'}</div>`}
function openAuthChoice(){document.getElementById('modalbox').innerHTML='<h2>HammerHunt Account</h2><p>Choose what you want to do.</p><div class="row" style="justify-content:flex-start"><button onclick="openSignUp()">Create Account</button><button class="light" onclick="openSignIn()">Sign In</button></div><div style="margin-top:14px"><button class="light" onclick="closeModal()">Close</button></div>';document.getElementById('modal').classList.add('show')}
function openSignUp(){document.getElementById('modalbox').innerHTML='<h2>Create Account</h2><label>Display name</label><input id="suName"><label>Email</label><input id="suEmail" type="email"><label>Password</label><input id="suPass" type="password" minlength="6"><button id="suBtn" class="good" style="margin-top:12px">Create My Account</button><div id="suMsg"></div><div style="margin-top:14px"><button class="light" onclick="openAuthChoice()">Back</button></div>';document.getElementById('modal').classList.add('show');document.getElementById('suBtn').onclick=async()=>{const name=document.getElementById('suName').value.trim(),email=document.getElementById('suEmail').value.trim(),password=document.getElementById('suPass').value,msg=document.getElementById('suMsg');if(!email||!password){msg.innerHTML='<div class="err">Enter email and password.</div>';return}msg.innerHTML='<div class="notice">Creating account…</div>';const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://www.hammerhunt.com',data:{display_name:name||email.split('@')[0]}}});if(error){msg.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}if(data.session){msg.innerHTML='<div class="ok">Account created and signed in.</div>';setTimeout(async()=>{closeModal();await boot()},500)}else msg.innerHTML='<div class="ok">Account created. Check your email for the confirmation message, then come back and sign in.</div>'}}
function openSignIn(){document.getElementById('modalbox').innerHTML='<h2>Sign In</h2><label>Email</label><input id="siEmail" type="email"><label>Password</label><input id="siPass" type="password"><button id="siBtn" style="margin-top:12px">Sign In</button><div id="siMsg"></div><div style="margin-top:14px"><button class="light" onclick="openAuthChoice()">Back</button></div>';document.getElementById('modal').classList.add('show');document.getElementById('siBtn').onclick=async()=>{const email=document.getElementById('siEmail').value.trim(),password=document.getElementById('siPass').value,msg=document.getElementById('siMsg');if(!email||!password){msg.innerHTML='<div class="err">Enter email and password.</div>';return}msg.innerHTML='<div class="notice">Signing in…</div>';const{error}=await sb.auth.signInWithPassword({email,password});if(error){msg.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}closeModal();await boot()}}
async function cardSetup(){if(!session)return openSignIn();const r=await fetch(SUPA+'/functions/v1/create-card-setup-checkout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:'{}'});const j=await r.json().catch(()=>({}));if(!r.ok||!j.url)return alert(j.error||'Unable to start Stripe setup.');location.href=j.url}
function renderAdmin(){if(!profile?.is_admin){document.getElementById('app').innerHTML='<div class="err">Admin access required.</div>';return}document.getElementById('app').innerHTML=`<div class="panel"><h2>Create Auction</h2><div class="formgrid"><div><label>Title</label><input id="aTitle"></div><div><label>Category</label><select id="aCat">${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Condition</label><input id="aCondition"></div><div><label>Starting bid</label><input id="aStart" type="number" min="0" step="5"></div><div class="full"><label>Description</label><textarea id="aDesc"></textarea></div><div><label>Ends at</label><input id="aEnd" type="datetime-local"></div><div><label>Shipping price</label><input id="aShip" type="number" min="0" step="0.01" value="0"></div><div><label><input id="aShipOn" type="checkbox" checked style="width:auto"> Shipping available</label></div><div><label><input id="aPickup" type="checkbox" style="width:auto"> Local pickup available</label></div><div class="full"><label>Pickup instructions</label><input id="aPickupInfo"></div></div><button class="good" style="margin-top:12px" onclick="createAuction()">Publish Auction</button></div>`}
async function createAuction(){const title=aTitle.value.trim(),start=Number(aStart.value),end=aEnd.value;if(!title||!end||Number.isNaN(start))return alert('Enter title, starting bid, and end time.');const row={title,category_id:aCat.value,condition:aCondition.value.trim(),description:aDesc.value.trim(),starting_bid:start,current_bid:start,starts_at:new Date().toISOString(),ends_at:new Date(end).toISOString(),status:'live',shipping_available:aShipOn.checked,shipping_price:aShipOn.checked?Number(aShip.value||0):null,pickup_available:aPickup.checked,pickup_instructions:aPickup.checked?aPickupInfo.value.trim():null};const{error}=await sb.from('auctions').insert(row);if(error)return alert(error.message);await loadData();alert('Auction published.');renderAdmin()}
boot();</script></body></html>
