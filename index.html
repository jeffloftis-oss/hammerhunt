function onPhotoPick(event){
  const files=Array.from(event?.target?.files||[]).filter(f=>f.type?.startsWith('image/')).slice(0,10);
  pendingPhotos=files;
  const preview=document.getElementById('photoPreview');
  if(!preview)return;
  preview.innerHTML='';
  files.forEach((file,i)=>{
    const box=document.createElement('div');
    box.className='preview';
    const img=document.createElement('img');
    img.alt=`Auction photo ${i+1}`;
    const url=URL.createObjectURL(file);
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);
    preview.appendChild(box);
  });
}

function openEditAuction(id){
  const a=auctions.find(x=>x.id===id); if(!a)return;
  const mins=Math.max(1,Math.round((new Date(a.ends_at).getTime()-Date.now())/60000));
  document.getElementById('modalbox').innerHTML=`<h2>Edit Auction</h2>
  ${a.status==='ended'?'<div class="notice"><b>This auction has ended.</b> Editing will not reopen it. Use Relist to create a fresh auction.</div>':''}
  <label>Title</label><input id="eTitle" value="${esc(a.title)}">
  <label>Condition</label><input id="eCondition" value="${esc(a.condition||'')}">
  <label>Description</label><textarea id="eDesc">${esc(a.description||'')}</textarea>
  <label>Minutes remaining</label><input id="eDuration" type="number" min="1" step="1" value="${mins}">
  <label>Shipping price</label><input id="eShip" type="number" min="0" step="0.01" value="${Number(a.shipping_price||0)}">
  <label><input id="eShipOn" type="checkbox" style="width:auto" ${a.shipping_available?'checked':''}> Shipping available</label>
  <label><input id="ePickup" type="checkbox" style="width:auto" ${a.pickup_available?'checked':''}> Local pickup available</label>
  <label>Pickup instructions</label><input id="ePickupInfo" value="${esc(a.pickup_instructions||'')}">
  <div style="display:flex;gap:8px;margin-top:14px"><button id="saveEditAuction" class="good">Save Changes</button><button class="light" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('saveEditAuction').onclick=async()=>{
    const duration=Math.max(1,Number(document.getElementById('eDuration').value||1));
    const patch={title:document.getElementById('eTitle').value.trim(),condition:document.getElementById('eCondition').value.trim(),description:document.getElementById('eDesc').value.trim(),ends_at:a.status==='ended'?a.ends_at:new Date(Date.now()+duration*60000).toISOString(),shipping_available:document.getElementById('eShipOn').checked,shipping_price:document.getElementById('eShipOn').checked?Number(document.getElementById('eShip').value||0):null,pickup_available:document.getElementById('ePickup').checked,pickup_instructions:document.getElementById('ePickup').checked?document.getElementById('ePickupInfo').value.trim():null};
    const {error}=await sb.from('auctions').update(patch).eq('id',id);
    if(error)return alert(error.message);
    closeModal(); await loadData(); renderAdmin();
  };
}

function openRelistAuction(id){
  const a=auctions.find(x=>x.id===id); if(!a)return;
  document.getElementById('modalbox').innerHTML=`<h2>Relist Auction</h2>
    <div class="notice">This creates a brand-new auction. Old bids, winner history, orders, and payments remain attached to the original listing.</div>
    <label>Title</label><input id="rTitle" value="${esc(a.title)}">
    <label>Starting bid</label><input id="rStart" type="number" min="0" step="5" value="${Number(a.starting_bid||a.current_bid||0)}">
    <label>Duration (minutes)</label><input id="rDuration" type="number" min="1" step="1" value="10">
    <label>Condition</label><input id="rCondition" value="${esc(a.condition||'')}">
    <label>Description</label><textarea id="rDesc">${esc(a.description||'')}</textarea>
    <label>Shipping price</label><input id="rShip" type="number" min="0" step="0.01" value="${Number(a.shipping_price||0)}">
    <label><input id="rShipOn" type="checkbox" style="width:auto" ${a.shipping_available?'checked':''}> Shipping available</label>
    <label><input id="rPickup" type="checkbox" style="width:auto" ${a.pickup_available?'checked':''}> Local pickup available</label>
    <label>Pickup instructions</label><input id="rPickupInfo" value="${esc(a.pickup_instructions||'')}">
    <div style="display:flex;gap:8px;margin-top:14px">
      <button id="saveRelistAuction" class="good">Create Relisted Auction</button>
      <button class="light" onclick="closeModal()">Cancel</button>
    </div>`;
  document.getElementById('modal').classList.add('show');

  document.getElementById('saveRelistAuction').onclick=async()=>{
    const duration=Math.max(1,Number(document.getElementById('rDuration').value||1));
    const start=Number(document.getElementById('rStart').value||0);
    const now=Date.now();
    const row={
      title:document.getElementById('rTitle').value.trim(),
      category_id:a.category_id,
      condition:document.getElementById('rCondition').value.trim(),
      description:document.getElementById('rDesc').value.trim(),
      starting_bid:start,
      current_bid:start,
      starts_at:new Date(now).toISOString(),
      ends_at:new Date(now+duration*60000).toISOString(),
      status:'live',
      shipping_available:document.getElementById('rShipOn').checked,
      shipping_price:document.getElementById('rShipOn').checked?Number(document.getElementById('rShip').value||0):null,
      pickup_available:document.getElementById('rPickup').checked,
      pickup_instructions:document.getElementById('rPickup').checked?document.getElementById('rPickupInfo').value.trim():null
    };
    if(!row.title)return alert('Enter a title.');
    const {data:newAuction,error}=await sb.from('auctions').insert(row).select('id').single();
    if(error)return alert(error.message);

    // Copy photo records to the new auction. Storage files can be shared by path.
    const oldPhotos=photosFor(id);
    if(oldPhotos.length){
      const photoRows=oldPhotos.map((p,i)=>({
        auction_id:newAuction.id,
        storage_path:p.storage_path,
        sort_order:i
      }));
      await sb.from('auction_photos').insert(photoRows);
    }

    closeModal();
    await loadData();
    renderAdmin();
    alert('Auction relisted.');
  };
}

async function deleteAuction(id){
  const a=auctions.find(x=>x.id===id); if(!a)return;
  if(!confirm(`Delete "${a.title}"? This cannot be undone.`))return;
  const {error}=await sb.from('auctions').delete().eq('id',id);
  if(error)return alert(error.message);
  await loadData(); renderAdmin();
}

async function updateFulfillment(orderId,hasTracking){
  const select=document.getElementById('fs-'+orderId);
  const msg=document.getElementById('save-msg-'+orderId);
  const status=select?.value||'pending';
  const tracking=hasTracking?(document.getElementById('trk-'+orderId)?.value||''):null;
  if(select)select.disabled=true;
  if(msg){msg.textContent='Saving...';msg.style.fontWeight='800'}
  try{
    const r=await fetch(SUPA+'/functions/v1/admin-update-fulfillment',{
      method:'POST',
      headers:{
        Authorization:'Bearer '+session.access_token,
        apikey:KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({order_id:orderId,status,tracking_number:tracking})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Unable to save fulfillment');
    if(msg){msg.textContent='Saved: '+status.replaceAll('_',' ');msg.style.fontWeight='900'}
    if(select)select.disabled=false;
  }catch(err){
    if(msg){msg.textContent='Save failed: '+(err?.message||String(err));msg.style.fontWeight='900'}
    if(select)select.disabled=false;
  }
}

async function createAuction(){const title=aTitle.value.trim(),start=Number(aStart.value),duration=Number(aDuration.value);if(!title||Number.isNaN(start)||!Number.isFinite(duration)||duration<1)return alert('Enter title, starting bid, and duration in minutes.');const now=Date.now();const row={title,category_id:aCat.value,condition:aCondition.value.trim(),description:aDesc.value.trim(),starting_bid:start,current_bid:start,starts_at:new Date(now).toISOString(),ends_at:new Date(now+duration*60000).toISOString(),status:'live',shipping_available:aShipOn.checked,shipping_price:aShipOn.checked?Number(aShip.value||0):null,pickup_available:aPickup.checked,pickup_instructions:aPickup.checked?aPickupInfo.value.trim():null};const{data:a,error}=await sb.from('auctions').insert(row).select('id').single();if(error)return alert(error.message);for(let i=0;i<pendingPhotos.length;i++){const f=pendingPhotos[i],raw=(f.name.split('.').pop()||'jpg').toLowerCase(),ext=raw.replace(/[^a-z0-9]/g,'')||'jpg',path=`${a.id}/${String(i).padStart(2,'0')}-${crypto.randomUUID()}.${ext}`;const{error:upErr}=await sb.storage.from('auction-images').upload(path,f,{contentType:f.type||undefined,upsert:false});if(upErr){alert(`Auction published, but photo ${i+1} failed: ${upErr.message}`);continue}const{error:dbErr}=await sb.from('auction_photos').insert({auction_id:a.id,storage_path:path,sort_order:i});if(dbErr)alert(`Photo ${i+1} uploaded but could not be attached: ${dbErr.message}`)}pendingPhotos=[];await loadData();alert('Auction published.');renderAdmin()}



boot();</script></body></html>
