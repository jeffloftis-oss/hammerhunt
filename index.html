:cover}.detailGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.bidBox{background:#f7f6f2;border:1px solid var(--line);border-radius:14px;padding:15px}.bigPrice{font-size:36px;font-weight:950}.photoPicker{border:2px dashed #d4d0c6;border-radius:14px;padding:16px;background:#fbfaf7;margin-bottom:14px}.previewGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:12px}.preview{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9e7e0}.preview img{width:100%;height:100%;object-fit:cover}.closedList{display:grid;gap:8px}.closedRow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.closedRow img{width:64px;height:50px;object-fit:cover;border-radius:8px;background:#eee}@media(max-width:700px){.detailGrid{grid-template-columns:1fr}.galleryMain{height:320px}.closedRow{grid-template-columns:54px 1fr}.closedRow .closedPrice{grid-column:2}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div class="brand">HAMMER<span>HUNT</span></div><nav><button class="ghost" onclick="showView('auctions')">Auctions</button><button class="ghost" onclick="showView('account')">My Account</button><button id="adminNav" class="ghost hidden" onclick="showView('admin')">Admin</button><button id="authBtn" class="ghost" onclick="openAuthChoice()">Sign In</button></nav></div></header><main id="app"><div class="panel">Loading HammerHunt…</div></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SUPA='https://cboodkfcfvshsxirpkxt.supabase.co';const KEY='sb_publishable_VDsMnqHeYHajdKendarwww_hMX9fMM2';const sb=createClient(SUPA,KEY);let session=null,profile=null,categories=[],auctions=[],currentView='auctions',activeAuctionId=null,realtimeChannel=null,photosByAuction={},galleryIndex=0,pendingPhotos=[];const money=n=>'$'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const remain=d=>{let x=new Date(d)-Date.now();if(x<=0)return'Ended';let h=Math.floor(x/36e5),m=Math.floor((x%36e5)/6e4),sec=Math.floor((x%6e4)/1e3);return h>=24?Math.floor(h/24)+'d '+(h%24)+'h':h>0?h+'h '+m+'m '+sec+'s':m+'m '+sec+'s'};const isOpen=a=>a.status!=='ended'&&new Date(a.ends_at)>new Date();const photosFor=id=>photosByAuction[id]||[];const photoUrl=p=>sb.storage.from('auction-images').getPublicUrl(p.storage_path).data.publicUrl;window.showView=showView;window.openAuthChoice=openAuthChoice;window.openSignIn=openSignIn;window.openSignUp=openSignUp;window.closeModal=()=>{activeAuctionId=null;document.getElementById('modal').classList.remove('show')};window.signOutNow=async()=>{await sb.auth.signOut();session=null;profile=null;await boot()};window.cardSetup=cardSetup;window.createAuction=createAuction;window.openAuction=openAuction;window.placeNextBid=placeNextBid;window.galleryMove=galleryMove;window.galleryPick=galleryPick;window.onPhotoPick=onPhotoPick;window.winnerCheckout=winnerCheckout;window.updateFulfillment=updateFulfillment;
function tickCountdowns(){let expired=false;document.querySelectorAll('[data-ends-at]').forEach(el=>{el.textContent=remain(el.dataset.endsAt);if(new Date(el.dataset.endsAt)<=new Date())expired=true});if(activeAuctionId){const a=auctions.find(x=>x.id===activeAuctionId);if(a){const el=document.getElementById('modalCountdown');if(el)el.textContent=remain(a.ends_at);if(new Date(a.ends_at)<=new Date()){const btn=document.getElementById('bidBtn');if(btn){btn.disabled=true;btn.textContent='Auction Ended'}}}}if(expired&&currentView==='auctions')renderAuctions()}
setInterval(tickCountdowns,1000);
async function refreshLiveAuction(payload){if(payload?.new?.id){const i=auctions.findIndex(a=>a.id===payload.new.id);if(i>=0)auctions[i]={...auctions[i],...payload.new};else await loadData()}else await loadData();if(currentView==='auctions')renderAuctions();if(activeAuctionId)openAuction(activeAuctionId)}
async function finalizeExpiredAuctions(){
const expired=auctions.filter(a=>a.status!=='ended'&&new Date(a.ends_at)<=new Date());
if(!expired.length)return;
for(const a of expired){try{await sb.rpc('finalize_auction',{p_auction_id:a.id})}catch(e){}}
await loadData()
}
async function verifyWinnerPayment(sessionId){
if(!session||!sessionId)return;
try{
const r=await fetch(SUPA+'/functions/v1/verify-winner-payment',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});
const j=await r.json().catch(()=>({}));
if(!r.ok)alert(j.error||'Unable to verify payment.');
}catch(e){alert('Unable to verify payment.')}
}
async function winnerCheckout(auctionId,method){
if(!session)return openSignIn();
const r=await fetch(SUPA+'/functions/v1/create-winner-checkout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({auction_id:auctionId,fulfillment_method:method})});
const j=await r.json().catch(()=>({}));
if(!r.ok)return alert(j.error||'Unable to start checkout.');
if(j.paid){alert('This auction is already paid.');return renderAccount()}
if(!j.url)return alert('Checkout link was not returned.');
location.href=j.url
}
function startRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('hammerhunt-auctions').on('postgres_changes',{event:'*',schema:'public',table:'auctions'},refreshLiveAuction).on('postgres_changes',{event:'*',schema:'public',table:'auction_photos'},async()=>{await loadData();if(currentView==='auctions')renderAuctions();if(currentView==='admin')renderAdmin();if(activeAuctionId)openAuction(activeAuctionId,true)}).subscribe()}
async function pollAuctions(){if(document.hidden)return;const before=JSON.stringify(auctions.map(x=>[x.id,x.current_bid,x.ends_at,x.status,photosFor(x.id).length]));await loadData();await finalizeExpiredAuctions();const after=JSON.stringify(auctions.map(x=>[x.id,x.current_bid,x.ends_at,x.status,photosFor(x.id).length]));if(before!==after){if(currentView==='auctions')renderAuctions();if(currentView==='admin')renderAdmin();if(activeAuctionId)openAuction(activeAuctionId,true)}}
setInterval(pollAuctions,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollAuctions()});
async function boot(){
const{data:{session:s}}=await sb.auth.getSession();session=s;
if(session){const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();profile=p}else profile=null;
const b=document.getElementById('authBtn');b.textContent=session?'Sign Out':'Sign In';b.onclick=session?window.signOutNow:openAuthChoice;
document.getElementById('adminNav').classList.toggle('hidden',!profile?.is_admin);
await loadData();await finalizeExpiredAuctions();startRealtime();
const qs=new URLSearchParams(location.search);
if(session&&qs.get('checkout')==='success'&&qs.get('session_id')){await verifyWinnerPayment(qs.get('session_id'));history.replaceState({},'',location.pathname);showView('account');return}
showView(location.search.includes('payment=')?'account':'auctions')}
async function loadData(){const[{data:c},{data:a},{data:p}]=await Promise.all([sb.from('categories').select('*').eq('is_active',true).order('sort_order'),sb.from('auctions').select('*,categories(name)').in('status',['scheduled','live','ended']).order('ends_at'),sb.from('auction_photos').select('*').order('sort_order').order('created_at')]);categories=c||[];auctions=a||[];photosByAuction={};for(const ph of(p||[]))(photosByAuction[ph.auction_id]??=[]).push(ph)}
function showView(v){currentView=v;activeAuctionId=null;if(v==='auctions')renderAuctions();if(v==='account')renderAccount();if(v==='admin')renderAdmin()}
function renderAuctions(){const open=auctions.filter(isOpen);let html='<section class="hero"><h1>Bid. Win. Done.</h1><p>Verified bidders, live pricing, multiple photos, $5 increments, and a 1-minute anti-sniping rule.</p></section>';if(!session)html+='<div class="notice"><b>Want to bid?</b> Create an account and add a payment method first.</div>';html+=`<div class="row"><h2>Live Auctions</h2><span class="status">${open.length} active</span></div>`;html+='<div class="grid">'+(open.length?open.map(a=>{const pics=photosFor(a.id),cover=pics[0];return `<article class="card" onclick="openAuction('${a.id}')"><div class="photo">${cover?`<img src="${photoUrl(cover)}" alt="${esc(a.title)}">`:'<div class="fallback">HAMMERHUNT</div>'}${pics.length?`<span class="photoCount">${pics.length} photo${pics.length===1?'':'s'}</span>`:''}</div><div class="pad"><div class="category">${esc(a.categories?.name||'Auction')}</div><div class="title">${esc(a.title)}</div><div class="priceRow"><div><div class="muted">CURRENT BID</div><div class="price">${money(a.current_bid)}</div></div><div style="text-align:right"><div class="muted">TIME LEFT</div><div class="countdown" data-ends-at="${a.ends_at}">${remain(a.ends_at)}</div></div></div><div class="muted" style="margin-top:8px">${a.shipping_available?`Shipping ${money(a.shipping_price)}`:'No shipping'}${a.pickup_available?' • Pickup available':''}</div><button class="goldBtn" style="margin-top:12px;width:100%">View & Bid</button></div></article>`}).join(''):'<div class="panel">No active auctions right now.</div>')+'</div>';document.getElementById('app').innerHTML=html;tickCountdowns()}
function openAuction(id,preserveGallery=false){activeAuctionId=id;const a=auctions.find(x=>x.id===id);if(!a)return;const pics=photosFor(id);if(!preserveGallery)galleryIndex=0;if(galleryIndex>=pics.length)galleryIndex=0;const ended=!isOpen(a);const next=Number(a.current_bid||0)+5;let action='';if(!session)action='<div class="notice">Sign in and add a payment method before bidding.</div><button onclick="openSignIn()">Sign In</button>';else if(!profile?.payment_verified)action='<div class="notice">A verified payment method is required before bidding.</div><button class="good" onclick="closeModal();showView(\'account\')">Add Payment Method</button>';else if(ended)action='<div class="notice">This auction has ended.</div>';else action=`<div class="ok">You are approved to bid.</div><button id="bidBtn" class="goldBtn" style="width:100%;padding:12px;border:0;border-radius:9px;font-weight:900" onclick="placeNextBid('${a.id}')">Place ${money(next)} Bid</button><p class="muted">Bids advance by $5. A bid in the final 1 minute resets the clock to 1 minute.</p>`;const cur=pics[galleryIndex];const gallery=`<div class="galleryMain">${cur?`<img src="${photoUrl(cur)}" alt="${esc(a.title)}">`:'<div class="galleryFallback">No photos yet</div>'}${pics.length>1?'<button class="galleryNav prev" onclick="galleryMove(-1)">‹</button><button class="galleryNav next" onclick="galleryMove(1)">›</button>':''}</div>${pics.length>1?`<div class="thumbs">${pics.map((p,i)=>`<button class="thumb ${i===galleryIndex?'active':''}" onclick="galleryPick(${i})"><img src="${photoUrl(p)}"></button>`).join('')}</div>`:''}`;document.getElementById('modalbox').innerHTML=`${gallery}<div style="padding:20px"><div class="detailGrid"><div><div class="category">${esc(a.categories?.name||'Auction')}</div><h2 style="font-size:28px;margin:5px 0 10px">${esc(a.title)}</h2>${a.condition?`<p><b>Condition:</b> ${esc(a.condition)}</p>`:''}${a.description?`<p>${esc(a.description)}</p>`:''}<p class="muted">${a.shipping_available?`Shipping ${money(a.shipping_price)}`:'No shipping'}${a.pickup_available?' • Pickup available':''}</p></div><div class="bidBox"><div class="muted">CURRENT BID</div><div class="bigPrice">${money(a.current_bid)}</div><div class="muted">TIME LEFT</div><div id="modalCountdown" class="countdown" data-ends-at="${a.ends_at}">${remain(a.ends_at)}</div>${action}</div></div><div style="margin-top:14px"><button class="light" onclick="closeModal()">Close</button></div></div>`;document.getElementById('modal').classList.add('show');tickCountdowns()}
function galleryMove(d){const pics=photosFor(activeAuctionId);if(!pics.length)return;galleryIndex=(galleryIndex+d+pics.length)%pics.length;openAuction(activeAuctionId,true)}
function galleryPick(i){galleryIndex=i;openAuction(activeAuctionId,true)}
async function placeNextBid(id){const btn=document.getElementById('bidBtn');if(btn){btn.disabled=true;btn.textContent='Placing bid…'}const{data,error}=await sb.rpc('place_next_bid',{p_auction_id:id});if(error){alert(error.message);await pollAuctions();return}const placed=Array.isArray(data)&&data[0]?(data[0].new_current_bid??data[0].amount):null;await loadData();closeModal();renderAuctions();alert(placed!=null?`Bid placed at ${money(placed)}.`:'Bid placed successfully.')}
async function renderAccount(){
if(!session){document.getElementById('app').innerHTML='<div class="panel"><h2>My Account</h2><p>Create an account or sign in to bid.</p><div class="row" style="justify-content:flex-start"><button onclick="openSignUp()">Create Account</button><button class="light" onclick="openSignIn()">Sign In</button></div></div>';return}

const[{data:bids},{data:wins}]=await Promise.all([

sb.from('orders').select('*,auctions(title,shipping_available,shipping_price,pickup_available,pickup_instructions)').order('created_at',{ascending:false})
]);
const winHtml=wins?.length?wins.map(w=>{
const a=w.auctions||{},paid=w.payment_status==='paid';
let actions='';
if(paid)actions=`<div class="ok"><b>Paid.</b> ${w.fulfillment_method==='shipping'?'Shipping selected.':'Local pickup selected.'}</div>`;
else{
